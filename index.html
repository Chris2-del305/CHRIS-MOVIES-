<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>CHRIS MOVIES · Vertical Stream</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #000000;
      color: #ffffff;
      height: 100%;
      width: 100%;
    }

    /* main container fills parent */
    .app-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
      background: #000000;
    }

    /* header */
    header {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.96);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 70px;
      z-index: 1100;
      border-bottom: 1px solid #e50914;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #e50914, #ff4d4d);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .nav-tabs {
      display: flex;
      gap: 12px;
      background: #0f0f0f;
      padding: 4px 12px;
      border-radius: 60px;
    }

    .nav-tab {
      background: none;
      border: none;
      color: #eee;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .nav-tab.active {
      background: #e50914;
      color: white;
    }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-badge {
      background: #1a1a1a;
      border-radius: 40px;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #e50914;
      cursor: pointer;
    }

    .three-dots {
      background: #1a1a1a;
      width: 38px;
      height: 38px;
      border-radius: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      border: 1px solid #333;
    }
    .three-dots:hover { background: #e50914; }

    .dropdown-menu {
      position: absolute;
      top: 70px;
      right: 20px;
      background: #111;
      border-radius: 20px;
      width: 180px;
      display: none;
      z-index: 1300;
      border: 1px solid #e50914;
      overflow: hidden;
    }
    .dropdown-menu button {
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      padding: 12px 18px;
      color: white;
      cursor: pointer;
    }
    .dropdown-menu button:hover { background: #e50914; }

    .auth-btn {
      background: #e50914;
      border: none;
      padding: 6px 18px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* main content - vertical arrangement (fill parent) */
    .main-content {
      flex: 1;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    /* CHRIS MOVIES label */
    .app-title {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      color: white;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
      text-shadow: 0 0 8px rgba(229,9,20,0.3);
    }

    /* search bar - fill parent width */
    .search-container {
      width: 100%;
      margin-bottom: 24px;
    }
    .search-container input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 60px;
      background: #121212;
      border: 1px solid #2a2a2a;
      color: white;
      font-size: 15px;
      outline: none;
    }
    .search-container input:focus {
      border-color: #e50914;
    }

    /* vertical movies list - each card uses full width */
    .movies-vertical-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      margin-top: 8px;
    }

    /* movie card - vertical arrangement, poster fill width */
    .movie-card-vertical {
      background: #0c0c0c;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid #222;
      transition: 0.2s;
      width: 100%;
      cursor: pointer;
    }
    .movie-card-vertical:hover {
      border-color: #e50914;
      transform: translateY(-4px);
      background: #111;
    }
    /* poster: width fill parent, height fixed around 200px */
    .movie-poster-full {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      background: #1a1a1a;
    }
    .movie-info-vertical {
      padding: 16px;
    }
    .movie-title-vertical {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .movie-desc-vertical {
      font-size: 0.8rem;
      color: #bbbbbb;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .play-button {
      background: #e50914;
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      width: fit-content;
    }

    /* live tv horizontal rows (kept scrollable) */
    .live-category-row {
      margin-bottom: 32px;
    }
    .row-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .row-title {
      font-size: 1.4rem;
      font-weight: 700;
      border-left: 4px solid #e50914;
      padding-left: 12px;
    }
    .horizontal-scroll {
      display: flex;
      overflow-x: auto;
      gap: 16px;
      padding-bottom: 12px;
      scrollbar-width: thin;
    }
    .channel-card {
      flex: 0 0 160px;
      background: #0c0c0c;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #2a2a2a;
    }
    .channel-thumb {
      width: 100%;
      height: 100px;
      background-size: cover;
      background-position: center;
    }
    .channel-name {
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
    }

    /* modal */
    .modal-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.95); backdrop-filter: blur(10px);
      z-index: 2000; display: none;
    }
    .modal {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #111; padding: 24px; border-radius: 32px;
      width: 90%; max-width: 400px; z-index: 2100;
      border: 1px solid #e50914; display: none;
    }
    .modal h3 { color: #e50914; margin-bottom: 16px; }
    .modal input, .modal select {
      width: 100%; padding: 12px; margin-bottom: 14px;
      background: #222; border: 1px solid #3a3a3a; border-radius: 30px; color: white;
    }
    .btn-red {
      background: #e50914; border: none; padding: 12px; border-radius: 40px;
      color: white; font-weight: 700; width: 100%; margin-top: 8px; cursor: pointer;
    }
    .close-icon {
      position: absolute; top: 12px; right: 16px; font-size: 24px; cursor: pointer; color: #aaa;
    }
    #videoModal {
      width: 95%; max-width: 1000px; background: #000; padding: 6px; border-radius: 24px;
    }
    #videoPlayer iframe, #videoPlayer video {
      width: 100%; aspect-ratio: 16/9; border-radius: 20px; background: #000;
    }
    footer {
      text-align: center; padding: 20px; color: #555; font-size: 12px;
      border-top: 1px solid #1f1f1f; margin-top: 20px;
    }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #1f1f1f; padding: 10px 24px; border-radius: 60px; display: none;
      z-index: 3000; border-left: 4px solid #e50914; color: white; font-size: 14px;
    }
    .empty-movies {
      text-align: center; padding: 40px; color: #888;
    }
    @media (max-width: 550px) {
      .movie-poster-full { height: 180px; }
      .app-title { font-size: 24px; }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>
<div class="app-wrapper">
  <header>
    <div class="logo">CHRIS X</div>
    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="movies">🎬 MOVIES</button>
      <button class="nav-tab" data-tab="live">📺 LIVE TV</button>
    </div>
    <div class="right-controls">
      <div class="user-badge" id="userBtn" style="display: none;">👤 <span id="userEmailLabel"></span></div>
      <button class="auth-btn" id="signInBtn">SIGN IN</button>
      <div class="three-dots" id="threeDotsBtn">⋮</div>
    </div>
    <div class="dropdown-menu" id="dropdownMenu">
      <button id="adminPanelBtn">🔧 Admin Panel</button>
      <button id="logoutBtn">🚪 Sign Out</button>
    </div>
  </header>

  <div class="main-content">
    <!-- CHRIS MOVIES label (bold, white, centered, size 24) -->
    <div class="app-title">CHRIS MOVIES</div>

    <!-- Search Bar fill parent width -->
    <div class="search-container">
      <input id="searchMoviesInput" type="text" placeholder="Search movies...">
    </div>

    <!-- MOVIES SECTION (vertical list) -->
    <div id="moviesSection">
      <div id="moviesVerticalList" class="movies-vertical-list">
        <!-- dynamic vertical movie cards will appear here -->
      </div>
    </div>

    <!-- LIVE TV SECTION (hidden by default) -->
    <div id="liveTvSection" style="display: none;">
      <div id="liveTvContainer"></div>
    </div>
  </div>
  <footer>⚡ Vertical · Full-width posters · Stream movies & live TV</footer>
</div>

<div id="toastMsg" class="toast"></div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="authOverlay"></div>
<div class="modal" id="authModal">
  <button class="close-icon" id="closeAuthX">&times;</button>
  <h3 id="authTitle">🔐 Sign In</h3>
  <input type="email" id="authEmail" placeholder="Email address">
  <input type="password" id="authPassword" placeholder="Password">
  <button id="authSubmitBtn" class="btn-red">Sign In</button>
  <button id="switchAuthBtn" style="background:transparent; color:#e50914; margin-top: 10px;">Create new account →</button>
  <button id="cancelAuthBtn" class="btn-red" style="background:#2a2a2a; margin-top: 8px;">Cancel</button>
</div>

<!-- VIDEO MODAL -->
<div class="modal-overlay" id="videoOverlay"></div>
<div class="modal" id="videoModal">
  <button class="close-icon" id="closeVideoX">&times;</button>
  <div id="videoPlayer"></div>
</div>

<!-- ADMIN PANEL (VIP removed) -->
<div class="modal-overlay" id="adminOverlay"></div>
<div class="modal" id="adminModal">
  <button class="close-icon" id="closeAdminX">&times;</button>
  <h3>🎬 Admin Panel</h3>
  <input type="file" id="adminPoster" accept="image/*">
  <input type="text" id="adminTitle" placeholder="Movie title">
  <input type="text" id="adminDesc" placeholder="Short description">
  <input type="url" id="adminYoutube" placeholder="YouTube link">
  <input type="url" id="adminVideoUrl" placeholder="Direct MP4 URL">
  <button onclick="addMovieAdmin()" class="btn-red">➕ Add Movie</button>
  <h4 style="margin: 20px 0 10px;">🗑️ Delete Movies</h4>
  <div id="adminMoviesList" style="max-height: 240px; overflow-y: auto;"></div>
</div>

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyASC5piaFqMnPbuXspM1c6_KE8A1sPLq2s",
    authDomain: "chris-movies-7ba0f.firebaseapp.com",
    projectId: "chris-movies-7ba0f",
    storageBucket: "chris-movies-7ba0f.firebasestorage.app",
    messagingSenderId: "867998448675",
    appId: "1:867998448675:web:8798f2286ca8d1b3e78596"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  const moviesCol = db.collection('movies');

  let allMovies = [];
  let currentUser = null;
  let activeTab = "movies";

  // Helper: toast
  function showToast(msg) {
    const toast = document.getElementById('toastMsg');
    toast.innerText = msg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 2500);
  }

  // Video player
  function playVideo(movie) {
    const src = movie.youtubeUrl || movie.videoUrl;
    if (!src) { showToast("No video source available"); return; }
    const container = document.getElementById('videoPlayer');
    container.innerHTML = '';
    const isYoutube = !!movie.youtubeUrl;
    if (isYoutube) {
      let vidId = src.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)?.[1];
      let embed = vidId ? `https://www.youtube.com/embed/${vidId}?autoplay=1&rel=0` : src;
      const iframe = document.createElement('iframe');
      iframe.src = embed;
      iframe.allowFullscreen = true;
      iframe.style.width = '100%';
      iframe.style.aspectRatio = '16/9';
      iframe.allow = 'autoplay; encrypted-media';
      container.appendChild(iframe);
    } else {
      const video = document.createElement('video');
      video.src = src;
      video.controls = true;
      video.autoplay = true;
      video.style.width = '100%';
      container.appendChild(video);
    }
    document.getElementById('videoModal').style.display = 'block';
    document.getElementById('videoOverlay').style.display = 'block';
  }

  // Render movies as VERTICAL LIST (poster width 100%, height 200px)
  function renderVerticalMovies(movies, searchTerm = "") {
    const container = document.getElementById('moviesVerticalList');
    if (!container) return;
    let filtered = movies;
    if (searchTerm.trim() !== "") {
      filtered = movies.filter(m => m.title?.toLowerCase().includes(searchTerm.toLowerCase()));
    }
    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-movies">🎬 No movies found. Add some via Admin panel.</div>';
      return;
    }
    container.innerHTML = "";
    filtered.forEach(movie => {
      const card = document.createElement('div');
      card.className = 'movie-card-vertical';
      card.innerHTML = `
        <img class="movie-poster-full" src="${movie.poster || 'https://placehold.co/400x200?text=No+Image'}" alt="${escapeHtml(movie.title)}">
        <div class="movie-info-vertical">
          <div class="movie-title-vertical">${escapeHtml(movie.title)}</div>
          <div class="movie-desc-vertical">${escapeHtml(movie.description || 'No description')}</div>
          <button class="play-button" data-id="${movie.id}">▶ PLAY NOW</button>
        </div>
      `;
      const playBtn = card.querySelector('.play-button');
      playBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        playVideo(movie);
      });
      container.appendChild(card);
    });
  }

  // LIVE TV data (working streams)
  const LIVE_CHANNELS = [
    { id: "l1", name: "Sky News Live", category: "News", thumb: "https://picsum.photos/id/20/300/180", stream: "https://www.youtube.com/embed/9Auq9mYxFEE?autoplay=1" },
    { id: "l2", name: "CNN International", category: "News", thumb: "https://picsum.photos/id/30/300/180", stream: "https://www.youtube.com/embed/mMFUYw5t-ng?autoplay=1" },
    { id: "l3", name: "NASA TV", category: "Entertainment", thumb: "https://picsum.photos/id/96/300/180", stream: "https://www.youtube.com/embed/21X5lGlDOfg?autoplay=1" },
    { id: "l4", name: "Red Bull TV", category: "Sports", thumb: "https://picsum.photos/id/29/300/180", stream: "https://www.youtube.com/embed/6fkJ-tBQfUw?autoplay=1" },
    { id: "l5", name: "Music 24/7", category: "Music", thumb: "https://picsum.photos/id/44/300/180", stream: "https://www.youtube.com/embed/1w7OgIMMRc4?autoplay=1" },
    { id: "l6", name: "EarthCam Live", category: "Entertainment", thumb: "https://picsum.photos/id/22/300/180", stream: "https://www.youtube.com/embed/5qap5aO4i9A?autoplay=1" },
    { id: "l7", name: "Bloomberg Live", category: "News", thumb: "https://picsum.photos/id/15/300/180", stream: "https://www.youtube.com/embed/fjGXs7I_KZo?autoplay=1" }
  ];

  function renderLiveTV() {
    const container = document.getElementById('liveTvContainer');
    if (!container) return;
    container.innerHTML = '';
    const categories = [...new Set(LIVE_CHANNELS.map(ch => ch.category))];
    categories.forEach(cat => {
      const filtered = LIVE_CHANNELS.filter(ch => ch.category === cat);
      const rowDiv = document.createElement('div');
      rowDiv.className = 'live-category-row';
      rowDiv.innerHTML = `
        <div class="row-header"><div class="row-title">📺 ${cat}</div></div>
        <div class="horizontal-scroll" id="scroll-${cat.replace(/\s/g,'')}"></div>
      `;
      const scrollDiv = rowDiv.querySelector('.horizontal-scroll');
      filtered.forEach(ch => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.innerHTML = `
          <div class="channel-thumb" style="background-image: url('${ch.thumb}');"></div>
          <div class="channel-name">${escapeHtml(ch.name)}</div>
        `;
        card.addEventListener('click', () => {
          const playerDiv = document.getElementById('videoPlayer');
          playerDiv.innerHTML = `<iframe src="${ch.stream}" frameborder="0" allow="autoplay; fullscreen" allowfullscreen style="width:100%; aspect-ratio:16/9; border-radius:20px;"></iframe>`;
          document.getElementById('videoModal').style.display = 'block';
          document.getElementById('videoOverlay').style.display = 'block';
        });
        scrollDiv.appendChild(card);
      });
      container.appendChild(rowDiv);
    });
    // All channels row
    const allRow = document.createElement('div');
    allRow.className = 'live-category-row';
    allRow.innerHTML = `<div class="row-header"><div class="row-title">🌟 ALL CHANNELS</div></div><div class="horizontal-scroll" id="allChannelsScroll"></div>`;
    const allScroll = allRow.querySelector('.horizontal-scroll');
    LIVE_CHANNELS.forEach(ch => {
      const card = document.createElement('div');
      card.className = 'channel-card';
      card.innerHTML = `<div class="channel-thumb" style="background-image: url('${ch.thumb}');"></div><div class="channel-name">${escapeHtml(ch.name)}</div>`;
      card.addEventListener('click', () => {
        const playerDiv = document.getElementById('videoPlayer');
        playerDiv.innerHTML = `<iframe src="${ch.stream}" frameborder="0" allow="autoplay; fullscreen" allowfullscreen style="width:100%; aspect-ratio:16/9; border-radius:20px;"></iframe>`;
        document.getElementById('videoModal').style.display = 'block';
        document.getElementById('videoOverlay').style.display = 'block';
      });
      allScroll.appendChild(card);
    });
    container.appendChild(allRow);
  }

  // Firestore snapshot (no VIP filtering)
  moviesCol.onSnapshot(snap => {
    let movies = [];
    snap.forEach(doc => {
      let data = doc.data();
      movies.push({ id: doc.id, ...data, likes: data.likes || 0 });
    });
    allMovies = movies;
    const searchVal = document.getElementById('searchMoviesInput')?.value || "";
    renderVerticalMovies(movies, searchVal);
    updateAdminMovieList(movies);
  });

  // Admin functions (VIP removed)
  function updateAdminMovieList(movies) {
    const container = document.getElementById('adminMoviesList');
    if (!container) return;
    container.innerHTML = movies.map(m => `
      <div style="display:flex; justify-content:space-between; background:#1a1a1a; padding:8px 14px; border-radius:40px; margin:6px 0;">
        <span style="font-size:13px;">${escapeHtml(m.title)}</span>
        <button onclick="deleteMovie('${m.id}')" style="background:#e50914; border:none; padding:3px 12px; border-radius:30px; color:white; cursor:pointer;">🗑️</button>
      </div>
    `).join('');
  }
  window.deleteMovie = async (id) => {
    await moviesCol.doc(id).delete();
    showToast("Movie deleted");
  };
  window.addMovieAdmin = () => {
    const file = document.getElementById('adminPoster').files[0];
    const title = document.getElementById('adminTitle').value.trim();
    if (!file || !title) { showToast("Poster image and title required"); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      moviesCol.add({
        title: title,
        poster: e.target.result,
        description: document.getElementById('adminDesc').value || "",
        youtubeUrl: document.getElementById('adminYoutube').value || null,
        videoUrl: document.getElementById('adminVideoUrl').value || null,
        likes: 0
      }).then(() => {
        showToast("Movie added!");
        document.getElementById('adminTitle').value = '';
        document.getElementById('adminPoster').value = '';
        document.getElementById('adminDesc').value = '';
        document.getElementById('adminYoutube').value = '';
        document.getElementById('adminVideoUrl').value = '';
      }).catch(err => showToast("Error: " + err.message));
    };
    reader.readAsDataURL(file);
  };

  // Authentication UI
  function updateAuthUI() {
    const userDiv = document.getElementById('userBtn');
    const signInBtn = document.getElementById('signInBtn');
    if (currentUser) {
      userDiv.style.display = 'flex';
      signInBtn.style.display = 'none';
      document.getElementById('userEmailLabel').innerText = currentUser.email.split('@')[0];
    } else {
      userDiv.style.display = 'none';
      signInBtn.style.display = 'block';
    }
  }
  let authMode = 'login';
  function openAuthModal() {
    document.getElementById('authTitle').innerText = authMode === 'login' ? '🔐 Sign In' : '📝 Create Account';
    document.getElementById('authSubmitBtn').innerText = authMode === 'login' ? 'Sign In' : 'Sign Up';
    document.getElementById('switchAuthBtn').innerText = authMode === 'login' ? 'Create new account →' : '← Back to Sign In';
    document.getElementById('authOverlay').style.display = 'block';
    document.getElementById('authModal').style.display = 'block';
  }
  async function handleAuthSubmit() {
    const email = document.getElementById('authEmail').value.trim();
    const pass = document.getElementById('authPassword').value.trim();
    if (!email || !pass) { showToast("Enter email & password"); return; }
    try {
      if (authMode === 'login') await auth.signInWithEmailAndPassword(email, pass);
      else await auth.createUserWithEmailAndPassword(email, pass);
      showToast(`Welcome ${email.split('@')[0]}!`);
      closeAuthModal();
    } catch (err) { showToast(err.message); }
  }
  function closeAuthModal() {
    document.getElementById('authOverlay').style.display = 'none';
    document.getElementById('authModal').style.display = 'none';
  }
  auth.onAuthStateChanged(user => { currentUser = user; updateAuthUI(); });

  // Tab switching
  function switchTab(tab) {
    activeTab = tab;
    const moviesDiv = document.getElementById('moviesSection');
    const liveDiv = document.getElementById('liveTvSection');
    if (tab === 'movies') {
      moviesDiv.style.display = 'block';
      liveDiv.style.display = 'none';
      renderVerticalMovies(allMovies, document.getElementById('searchMoviesInput').value);
    } else {
      moviesDiv.style.display = 'none';
      liveDiv.style.display = 'block';
      renderLiveTV();
    }
    document.querySelectorAll('.nav-tab').forEach(btn => {
      if (btn.dataset.tab === tab) btn.classList.add('active');
      else btn.classList.remove('active');
    });
  }

  // Event listeners
  const dotsBtn = document.getElementById('threeDotsBtn');
  const dropdown = document.getElementById('dropdownMenu');
  dotsBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block'; });
  document.addEventListener('click', () => dropdown.style.display = 'none');
  document.getElementById('adminPanelBtn').addEventListener('click', () => {
    if (prompt("Admin password:") === 'admin123') {
      document.getElementById('adminOverlay').style.display = 'block';
      document.getElementById('adminModal').style.display = 'block';
      dropdown.style.display = 'none';
    } else showToast("Wrong password");
  });
  document.getElementById('logoutBtn').addEventListener('click', () => { auth.signOut(); showToast("Signed out"); dropdown.style.display = 'none'; });
  document.getElementById('closeAdminX').addEventListener('click', () => { document.getElementById('adminOverlay').style.display = 'none'; document.getElementById('adminModal').style.display = 'none'; });
  document.getElementById('closeVideoX').addEventListener('click', () => { document.getElementById('videoPlayer').innerHTML = ''; document.getElementById('videoOverlay').style.display = 'none'; document.getElementById('videoModal').style.display = 'none'; });
  document.getElementById('videoOverlay').addEventListener('click', () => { document.getElementById('videoPlayer').innerHTML = ''; document.getElementById('videoOverlay').style.display = 'none'; document.getElementById('videoModal').style.display = 'none'; });
  document.getElementById('signInBtn').addEventListener('click', () => { authMode = 'login'; openAuthModal(); });
  document.getElementById('switchAuthBtn').addEventListener('click', () => { authMode = authMode === 'login' ? 'signup' : 'login'; openAuthModal(); });
  document.getElementById('authSubmitBtn').addEventListener('click', handleAuthSubmit);
  document.getElementById('closeAuthX').addEventListener('click', closeAuthModal);
  document.getElementById('cancelAuthBtn').addEventListener('click', closeAuthModal);
  document.getElementById('authOverlay').addEventListener('click', closeAuthModal);
  document.getElementById('searchMoviesInput').addEventListener('input', (e) => {
    if (activeTab === 'movies') renderVerticalMovies(allMovies, e.target.value);
  });

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
  }

  // initial load
  switchTab('movies');
</script>
</body>
</html>
