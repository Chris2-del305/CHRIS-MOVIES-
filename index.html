  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>ChrisFlix · Netflix Style with Categories</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #000000;
      color: #ffffff;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #e50914; border-radius: 10px; }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: linear-gradient(180deg, #000000 0%, rgba(0,0,0,0.85) 100%);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 70px;
      z-index: 1100;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #e50914, #ff4d4d);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 28px;
    }
    .nav-link {
      color: #e5e5e5;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .nav-link.active {
      color: #e50914;
      font-weight: 700;
    }
    .right-controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1a1a1a;
      padding: 6px 14px;
      border-radius: 30px;
      cursor: pointer;
      border: 1px solid #333;
    }
    .three-dots {
      background: #1a1a1a;
      width: 36px;
      height: 36px;
      border-radius: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      border: 1px solid #333;
    }
    .three-dots:hover { background: #e50914; }
    .auth-btn {
      background: #e50914;
      border: none;
      padding: 6px 18px;
      border-radius: 30px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .dropdown-menu {
      position: absolute;
      top: 70px;
      right: 40px;
      background: #0a0a0a;
      border-radius: 12px;
      width: 180px;
      display: none;
      z-index: 1200;
      border: 1px solid #e50914;
      overflow: hidden;
    }
    .dropdown-menu button {
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      padding: 12px 18px;
      color: white;
      cursor: pointer;
    }
    .dropdown-menu button:hover { background: #e50914; }

    /* search + categories bar */
    .search-category-area {
      margin: 90px 40px 20px 40px;
    }
    .search-input {
      width: 100%;
      max-width: 500px;
      padding: 12px 20px;
      border-radius: 40px;
      background: #1f1f1f;
      border: 1px solid #333;
      color: white;
      font-size: 16px;
      outline: none;
      margin-bottom: 20px;
    }
    .search-input:focus {
      border-color: #e50914;
    }
    .category-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .category-pill {
      background: #1f1f1f;
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      color: #e5e5e5;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .category-pill.active, .category-pill:hover {
      background: #e50914;
      color: white;
    }

    /* hero */
    .hero {
      position: relative;
      width: 100%;
      height: 80vh;
      min-height: 550px;
      margin-bottom: 30px;
      overflow: hidden;
    }
    .hero-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center top;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .hero-slide.active { opacity: 1; }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, #000000 10%, rgba(0,0,0,0.5) 70%);
      z-index: 1;
    }
    .hero-content {
      position: absolute;
      bottom: 28%;
      left: 6%;
      z-index: 2;
      max-width: 55%;
    }
    .hero-content h1 {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 12px;
      text-shadow: 0 2px 8px black;
    }
    .hero-content p {
      font-size: 1.1rem;
      margin-bottom: 20px;
      opacity: 0.9;
    }
    .hero-buttons {
      display: flex;
      gap: 16px;
    }
    .hero-btn {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border: none;
      padding: 10px 28px;
      border-radius: 8px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }
    .hero-btn.play {
      background: white;
      color: black;
    }

    /* rows */
    .row-container {
      margin-bottom: 50px;
      padding-left: 40px;
    }
    .row-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
      padding-right: 40px;
    }
    .row-title {
      font-size: 1.7rem;
      font-weight: 700;
    }
    .horizontal-scroll {
      display: flex;
      overflow-x: auto;
      gap: 16px;
      scroll-behavior: smooth;
      padding-bottom: 12px;
    }
    .horizontal-scroll::-webkit-scrollbar {
      height: 6px;
    }
    .movie-card {
      flex: 0 0 220px;
      cursor: pointer;
      transition: transform 0.25s ease;
      border-radius: 12px;
      overflow: hidden;
      background: #141414;
    }
    .movie-card:hover {
      transform: scale(1.05);
      z-index: 10;
    }
    .movie-card img {
      width: 100%;
      height: 310px;
      object-fit: cover;
    }
    .movie-card-info {
      padding: 10px;
    }
    .movie-title {
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-card {
      flex: 0 0 200px;
      background: #141414;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.2s;
    }
    .channel-card:hover { transform: scale(1.03); }
    .channel-thumb {
      width: 100%;
      height: 120px;
      background-size: cover;
      background-position: center;
    }
    .channel-name {
      padding: 12px;
      font-weight: 500;
      text-align: center;
      font-size: 0.85rem;
    }

    /* modals */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.96);
      backdrop-filter: blur(12px);
      z-index: 2000;
      display: none;
    }
    .modal {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #141414;
      padding: 28px;
      border-radius: 32px;
      width: 440px;
      max-width: 92%;
      z-index: 2100;
      border: 1px solid #e50914;
      display: none;
    }
    .modal h3 { color: #e50914; margin-bottom: 20px; }
    .modal input, .modal select {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      background: #222;
      border: 1px solid #3a3a3a;
      border-radius: 30px;
      color: white;
    }
    .btn-red {
      background: #e50914;
      border: none;
      padding: 12px;
      border-radius: 40px;
      color: white;
      font-weight: 700;
      width: 100%;
      margin-top: 8px;
      cursor: pointer;
    }
    .close-icon {
      position: absolute;
      top: 14px;
      right: 18px;
      font-size: 28px;
      cursor: pointer;
      color: #aaa;
    }
    #videoModal {
      width: 90%;
      max-width: 1100px;
      background: #000;
      padding: 8px;
      border-radius: 28px;
    }
    #videoPlayer iframe, #videoPlayer video {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 20px;
      background: #000;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1f1f1f;
      padding: 10px 24px;
      border-radius: 60px;
      display: none;
      z-index: 3000;
      border-left: 4px solid #e50914;
      color: white;
      font-size: 14px;
    }
    footer {
      text-align: center;
      padding: 30px;
      color: #555;
      border-top: 1px solid #1f1f1f;
      margin-top: 20px;
    }
    @media (max-width: 768px) {
      .hero-content h1 { font-size: 2rem; }
      .hero-content { max-width: 80%; bottom: 20%; }
      .row-container { padding-left: 20px; }
      .row-header { padding-right: 20px; }
      .movie-card { flex: 0 0 160px; }
      .movie-card img { height: 230px; }
      .hero { height: 65vh; }
      header { padding: 0 20px; }
      .search-category-area { margin: 90px 20px 20px 20px; }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>

<header>
  <div class="logo">CHRISFLIX</div>
  <div class="nav-links">
    <span class="nav-link active" data-tab="movies">Movies</span>
    <span class="nav-link" data-tab="live">Live TV</span>
  </div>
  <div class="right-controls">
    <div class="user-badge" id="userBtn" style="display: none;">👤 <span id="userEmailSpan"></span></div>
    <button class="auth-btn" id="signInBtn">Sign In</button>
    <div class="three-dots" id="threeDotsBtn">⋮</div>
  </div>
  <div class="dropdown-menu" id="dropdownMenu">
    <button id="adminPanelBtn">🔧 Admin Panel</button>
    <button id="logoutBtn">🚪 Sign Out</button>
  </div>
</header>

<!-- Search + Categories -->
<div class="search-category-area">
  <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search movies...">
  <div class="category-filters" id="categoryFilterBar"></div>
</div>

<div class="main-container">
  <!-- MOVIES TAB -->
  <div id="moviesTab">
    <div class="hero" id="heroCarousel"></div>
    <div id="moviesRowsContainer"></div>
  </div>

  <!-- LIVE TV TAB -->
  <div id="liveTab" style="display: none;">
    <div id="liveRowsContainer" style="padding-top: 20px;"></div>
  </div>
</div>
<footer>© ChrisFlix · Admin: three-dots (⋮) → Admin Panel | Categories filter above</footer>

<div id="toastMsg" class="toast"></div>

<!-- Auth Modal -->
<div class="modal-overlay" id="authOverlay"></div>
<div class="modal" id="authModal">
  <button class="close-icon" id="closeAuthX">&times;</button>
  <h3 id="authTitle">Sign In</h3>
  <input type="email" id="authEmail" placeholder="Email">
  <input type="password" id="authPassword" placeholder="Password">
  <button id="authSubmitBtn" class="btn-red">Sign In</button>
  <button id="switchAuthBtn" style="background:transparent; color:#e50914; margin-top: 10px;">Create account →</button>
  <button id="cancelAuthBtn" class="btn-red" style="background:#2a2a2a;">Cancel</button>
</div>

<!-- Video Modal -->
<div class="modal-overlay" id="videoOverlay"></div>
<div class="modal" id="videoModal">
  <button class="close-icon" id="closeVideoX">&times;</button>
  <div id="videoPlayer"></div>
</div>

<!-- Admin Panel Modal -->
<div class="modal-overlay" id="adminOverlay"></div>
<div class="modal" id="adminModal">
  <button class="close-icon" id="closeAdminX">&times;</button>
  <h3>Admin Panel · Add Movie</h3>
  <input type="file" id="adminPoster" accept="image/*">
  <input type="text" id="adminTitle" placeholder="Movie title">
  <input type="text" id="adminDesc" placeholder="Short description">
  <select id="adminGenre">
    <option value="Trending">Trending</option>
    <option value="New Releases">New Releases</option>
    <option value="Action">Action</option>
    <option value="Comedy">Comedy</option>
    <option value="Drama">Drama</option>
  </select>
  <input type="url" id="adminYoutube" placeholder="YouTube link">
  <input type="url" id="adminVideoUrl" placeholder="Direct MP4 URL">
  <button onclick="addMovieFromAdmin()" class="btn-red">➕ Add Movie</button>
  <h4 style="margin: 20px 0 10px;">🗑️ Delete Movies</h4>
  <div id="adminMovieList" style="max-height: 240px; overflow-y: auto;"></div>
</div>

<script>
  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyASC5piaFqMnPbuXspM1c6_KE8A1sPLq2s",
    authDomain: "chris-movies-7ba0f.firebaseapp.com",
    projectId: "chris-movies-7ba0f",
    storageBucket: "chris-movies-7ba0f.firebasestorage.app",
    messagingSenderId: "867998448675",
    appId: "1:867998448675:web:8798f2286ca8d1b3e78596"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  const moviesCol = db.collection('movies');

  let allMovies = [];
  let currentUser = null;
  let activeTab = "movies";
  let carouselInterval = null;
  let currentCategoryFilter = "All";

  function showToast(msg) {
    const t = document.getElementById('toastMsg');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
  }

  function playVideo(movie) {
    const src = movie.youtubeUrl || movie.videoUrl;
    if (!src) { showToast("No video source"); return; }
    const container = document.getElementById('videoPlayer');
    container.innerHTML = '';
    const isYoutube = !!movie.youtubeUrl;
    if (isYoutube) {
      let vidId = src.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)?.[1];
      let embed = vidId ? `https://www.youtube.com/embed/${vidId}?autoplay=1&rel=0` : src;
      const iframe = document.createElement('iframe');
      iframe.src = embed;
      iframe.allowFullscreen = true;
      iframe.style.width = '100%';
      iframe.style.aspectRatio = '16/9';
      iframe.allow = 'autoplay; encrypted-media';
      container.appendChild(iframe);
    } else {
      const video = document.createElement('video');
      video.src = src;
      video.controls = true;
      video.autoplay = true;
      video.style.width = '100%';
      container.appendChild(video);
    }
    document.getElementById('videoModal').style.display = 'block';
    document.getElementById('videoOverlay').style.display = 'block';
  }

  // Hero carousel
  function buildHero(movies) {
    const heroDiv = document.getElementById('heroCarousel');
    heroDiv.innerHTML = '<div class="hero-overlay"></div><div class="hero-content" id="heroContent"></div>';
    const existing = heroDiv.querySelectorAll('.hero-slide');
    existing.forEach(s => s.remove());
    if (!movies.length) {
      heroDiv.innerHTML += `<div class="hero-slide active" style="background-image: url('https://placehold.co/1200x700?text=CHRISFLIX')"></div>`;
      document.getElementById('heroContent').innerHTML = `<h1>Welcome to ChrisFlix</h1><p>Add movies via admin panel (⋮ menu)</p><div class="hero-buttons"><button class="hero-btn play">▶ Play</button></div>`;
      return;
    }
    const topMovies = movies.slice(0, 6);
    topMovies.forEach((m, idx) => {
      const slide = document.createElement('div');
      slide.className = 'hero-slide';
      if (idx === 0) slide.classList.add('active');
      slide.style.backgroundImage = `url('${m.poster}')`;
      heroDiv.appendChild(slide);
    });
    let currentIndex = 0;
    const updateHeroText = (movie) => {
      const heroContent = document.getElementById('heroContent');
      heroContent.innerHTML = `
        <h1>${escapeHtml(movie.title)}</h1>
        <p>${escapeHtml(movie.description || 'Now streaming')}</p>
        <div class="hero-buttons">
          <button class="hero-btn play" data-id="${movie.id}">▶ Play</button>
          <button class="hero-btn">More Info</button>
        </div>
      `;
      const playBtn = heroContent.querySelector('.hero-btn.play');
      playBtn.addEventListener('click', () => playVideo(movie));
    };
    if (topMovies[0]) updateHeroText(topMovies[0]);
    if (carouselInterval) clearInterval(carouselInterval);
    carouselInterval = setInterval(() => {
      const slides = heroDiv.querySelectorAll('.hero-slide');
      if (!slides.length) return;
      slides[currentIndex].classList.remove('active');
      currentIndex = (currentIndex + 1) % slides.length;
      slides[currentIndex].classList.add('active');
      if (topMovies[currentIndex]) updateHeroText(topMovies[currentIndex]);
    }, 6000);
  }

  // Render rows with category + search filter
  function renderRows(movies, searchTerm = "", category = "All") {
    const container = document.getElementById('moviesRowsContainer');
    if (!container) return;
    container.innerHTML = "";
    let filtered = movies;
    if (searchTerm.trim() !== "") {
      filtered = filtered.filter(m => m.title?.toLowerCase().includes(searchTerm.toLowerCase()));
    }
    if (category !== "All") {
      filtered = filtered.filter(m => (m.genre || "Trending") === category);
    }
    if (filtered.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:80px;">🎬 No movies match your selection.</div>';
      return;
    }
    // group by genre for rows
    const genreMap = new Map();
    filtered.forEach(m => {
      const genre = m.genre || "Trending";
      if (!genreMap.has(genre)) genreMap.set(genre, []);
      genreMap.get(genre).push(m);
    });
    const orderedGenres = ["Trending", "New Releases", "Action", "Comedy", "Drama"];
    const remaining = Array.from(genreMap.keys()).filter(g => !orderedGenres.includes(g));
    const allGenres = [...orderedGenres, ...remaining];
    allGenres.forEach(genre => {
      const moviesInGenre = genreMap.get(genre);
      if (!moviesInGenre || moviesInGenre.length === 0) return;
      const rowDiv = document.createElement('div');
      rowDiv.className = 'row-container';
      rowDiv.innerHTML = `
        <div class="row-header"><div class="row-title">${genre}</div></div>
        <div class="horizontal-scroll" id="scroll-${genre.replace(/\s/g,'')}"></div>
      `;
      const scrollDiv = rowDiv.querySelector('.horizontal-scroll');
      moviesInGenre.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <img src="${movie.poster || 'https://placehold.co/300x450?text=No+Poster'}" alt="${escapeHtml(movie.title)}">
          <div class="movie-card-info"><div class="movie-title">${escapeHtml(movie.title)}</div></div>
        `;
        card.addEventListener('click', () => playVideo(movie));
        scrollDiv.appendChild(card);
      });
      container.appendChild(rowDiv);
    });
  }

  // Build category filter pills
  function buildCategoryFilters() {
    const categories = ["All", "Trending", "New Releases", "Action", "Comedy", "Drama"];
    const bar = document.getElementById('categoryFilterBar');
    bar.innerHTML = categories.map(cat => `
      <button class="category-pill ${currentCategoryFilter === cat ? 'active' : ''}" data-cat="${cat}">${cat}</button>
    `).join('');
    bar.querySelectorAll('.category-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        currentCategoryFilter = btn.dataset.cat;
        buildCategoryFilters(); // re-render active state
        const searchVal = document.getElementById('searchInput').value;
        renderRows(allMovies, searchVal, currentCategoryFilter);
      });
    });
  }

  // Live TV
  const LIVE_CHANNELS = [
    { id: "l1", name: "Sky News Live", category: "News", thumb: "https://picsum.photos/id/20/300/180", stream: "https://www.youtube.com/embed/9Auq9mYxFEE?autoplay=1" },
    { id: "l2", name: "CNN Intl", category: "News", thumb: "https://picsum.photos/id/30/300/180", stream: "https://www.youtube.com/embed/mMFUYw5t-ng?autoplay=1" },
    { id: "l3", name: "NASA TV", category: "Entertainment", thumb: "https://picsum.photos/id/96/300/180", stream: "https://www.youtube.com/embed/21X5lGlDOfg?autoplay=1" },
    { id: "l4", name: "Red Bull TV", category: "Sports", thumb: "https://picsum.photos/id/29/300/180", stream: "https://www.youtube.com/embed/6fkJ-tBQfUw?autoplay=1" },
    { id: "l5", name: "Music 24/7", category: "Music", thumb: "https://picsum.photos/id/44/300/180", stream: "https://www.youtube.com/embed/1w7OgIMMRc4?autoplay=1" },
    { id: "l6", name: "EarthCam Live", category: "Entertainment", thumb: "https://picsum.photos/id/22/300/180", stream: "https://www.youtube.com/embed/5qap5aO4i9A?autoplay=1" },
    { id: "l7", name: "Bloomberg Live", category: "News", thumb: "https://picsum.photos/id/15/300/180", stream: "https://www.youtube.com/embed/fjGXs7I_KZo?autoplay=1" }
  ];
  function renderLiveTV() {
    const container = document.getElementById('liveRowsContainer');
    if (!container) return;
    container.innerHTML = '';
    const categories = [...new Set(LIVE_CHANNELS.map(ch => ch.category))];
    categories.forEach(cat => {
      const filtered = LIVE_CHANNELS.filter(ch => ch.category === cat);
      const rowDiv = document.createElement('div');
      rowDiv.className = 'row-container';
      rowDiv.innerHTML = `<div class="row-header"><div class="row-title">${cat}</div></div><div class="horizontal-scroll" id="live-${cat.replace(/\s/g,'')}"></div>`;
      const scroll = rowDiv.querySelector('.horizontal-scroll');
      filtered.forEach(ch => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.innerHTML = `<div class="channel-thumb" style="background-image: url('${ch.thumb}');"></div><div class="channel-name">${escapeHtml(ch.name)}</div>`;
        card.addEventListener('click', () => {
          const playerDiv = document.getElementById('videoPlayer');
          playerDiv.innerHTML = `<iframe src="${ch.stream}" frameborder="0" allow="autoplay; fullscreen" allowfullscreen style="width:100%; aspect-ratio:16/9; border-radius:20px;"></iframe>`;
          document.getElementById('videoModal').style.display = 'block';
          document.getElementById('videoOverlay').style.display = 'block';
        });
        scroll.appendChild(card);
      });
      container.appendChild(rowDiv);
    });
    // All channels row
    const allRow = document.createElement('div');
    allRow.className = 'row-container';
    allRow.innerHTML = `<div class="row-header"><div class="row-title">All Channels</div></div><div class="horizontal-scroll" id="allChannelsScroll"></div>`;
    const allScroll = allRow.querySelector('.horizontal-scroll');
    LIVE_CHANNELS.forEach(ch => {
      const card = document.createElement('div');
      card.className = 'channel-card';
      card.innerHTML = `<div class="channel-thumb" style="background-image: url('${ch.thumb}');"></div><div class="channel-name">${escapeHtml(ch.name)}</div>`;
      card.addEventListener('click', () => {
        const playerDiv = document.getElementById('videoPlayer');
        playerDiv.innerHTML = `<iframe src="${ch.stream}" frameborder="0" allow="autoplay; fullscreen" allowfullscreen style="width:100%; aspect-ratio:16/9; border-radius:20px;"></iframe>`;
        document.getElementById('videoModal').style.display = 'block';
        document.getElementById('videoOverlay').style.display = 'block';
      });
      allScroll.appendChild(card);
    });
    container.appendChild(allRow);
  }

  // Firestore realtime
  moviesCol.onSnapshot(snap => {
    let movies = [];
    snap.forEach(doc => {
      let data = doc.data();
      movies.push({ id: doc.id, ...data });
    });
    allMovies = movies;
    if (activeTab === 'movies') {
      buildHero(movies);
      const searchVal = document.getElementById('searchInput').value;
      renderRows(movies, searchVal, currentCategoryFilter);
    }
    updateAdminList(movies);
  });

  // Admin functions
  function updateAdminList(movies) {
    const container = document.getElementById('adminMovieList');
    if (!container) return;
    container.innerHTML = movies.map(m => `
      <div style="display:flex; justify-content:space-between; background:#1a1a1a; margin:8px 0; padding:8px 12px; border-radius:30px;">
        <span style="font-size:13px;">${escapeHtml(m.title)}</span>
        <button onclick="deleteMovie('${m.id}')" style="background:#e50914; border:none; padding:4px 12px; border-radius:30px; color:white; cursor:pointer;">Delete</button>
      </div>
    `).join('');
  }
  window.deleteMovie = async (id) => {
    await moviesCol.doc(id).delete();
    showToast("Movie deleted");
  };
  window.addMovieFromAdmin = () => {
    const file = document.getElementById('adminPoster').files[0];
    const title = document.getElementById('adminTitle').value.trim();
    if (!file || !title) { showToast("Poster and title required"); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      moviesCol.add({
        title: title,
        poster: e.target.result,
        description: document.getElementById('adminDesc').value || "",
        genre: document.getElementById('adminGenre').value,
        youtubeUrl: document.getElementById('adminYoutube').value || null,
        videoUrl: document.getElementById('adminVideoUrl').value || null
      }).then(() => {
        showToast("Movie added!");
        document.getElementById('adminTitle').value = '';
        document.getElementById('adminPoster').value = '';
        document.getElementById('adminDesc').value = '';
        document.getElementById('adminYoutube').value = '';
        document.getElementById('adminVideoUrl').value = '';
      }).catch(err => showToast("Error: " + err.message));
    };
    reader.readAsDataURL(file);
  };

  // Auth
  function updateAuthUI() {
    const userDiv = document.getElementById('userBtn');
    const signInBtn = document.getElementById('signInBtn');
    if (currentUser) {
      userDiv.style.display = 'flex';
      signInBtn.style.display = 'none';
      document.getElementById('userEmailSpan').innerText = currentUser.email.split('@')[0];
    } else {
      userDiv.style.display = 'none';
      signInBtn.style.display = 'block';
    }
  }
  let authMode = 'login';
  function openAuthModal() {
    document.getElementById('authTitle').innerText = authMode === 'login' ? 'Sign In' : 'Create Account';
    document.getElementById('authSubmitBtn').innerText = authMode === 'login' ? 'Sign In' : 'Sign Up';
    document.getElementById('switchAuthBtn').innerText = authMode === 'login' ? 'Create account →' : '← Back to Sign In';
    document.getElementById('authOverlay').style.display = 'block';
    document.getElementById('authModal').style.display = 'block';
  }
  async function handleAuthSubmit() {
    const email = document.getElementById('authEmail').value.trim();
    const pass = document.getElementById('authPassword').value.trim();
    if (!email || !pass) { showToast("Enter credentials"); return; }
    try {
      if (authMode === 'login') await auth.signInWithEmailAndPassword(email, pass);
      else await auth.createUserWithEmailAndPassword(email, pass);
      showToast(`Welcome ${email.split('@')[0]}!`);
      closeAuthModal();
    } catch (err) { showToast(err.message); }
  }
  function closeAuthModal() {
    document.getElementById('authOverlay').style.display = 'none';
    document.getElementById('authModal').style.display = 'none';
  }
  auth.onAuthStateChanged(user => { currentUser = user; updateAuthUI(); });

  // Tabs and search
  function switchTab(tab) {
    activeTab = tab;
    const moviesDiv = document.getElementById('moviesTab');
    const liveDiv = document.getElementById('liveTab');
    if (tab === 'movies') {
      moviesDiv.style.display = 'block';
      liveDiv.style.display = 'none';
      buildHero(allMovies);
      const searchVal = document.getElementById('searchInput').value;
      renderRows(allMovies, searchVal, currentCategoryFilter);
    } else {
      moviesDiv.style.display = 'none';
      liveDiv.style.display = 'block';
      renderLiveTV();
    }
    document.querySelectorAll('.nav-link').forEach(link => {
      if (link.dataset.tab === tab) link.classList.add('active');
      else link.classList.remove('active');
    });
  }

  // Event listeners
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', () => switchTab(link.dataset.tab));
  });
  const dotsBtn = document.getElementById('threeDotsBtn');
  const dropdown = document.getElementById('dropdownMenu');
  dotsBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block'; });
  document.addEventListener('click', () => dropdown.style.display = 'none');
  document.getElementById('adminPanelBtn').addEventListener('click', () => {
    if (prompt("Admin password:") === 'admin123') {
      document.getElementById('adminOverlay').style.display = 'block';
      document.getElementById('adminModal').style.display = 'block';
      dropdown.style.display = 'none';
    } else showToast("Wrong password");
  });
  document.getElementById('logoutBtn').addEventListener('click', () => { auth.signOut(); showToast("Signed out"); dropdown.style.display = 'none'; });
  document.getElementById('closeAdminX').addEventListener('click', () => { document.getElementById('adminOverlay').style.display = 'none'; document.getElementById('adminModal').style.display = 'none'; });
  document.getElementById('closeVideoX').addEventListener('click', () => { document.getElementById('videoPlayer').innerHTML = ''; document.getElementById('videoOverlay').style.display = 'none'; document.getElementById('videoModal').style.display = 'none'; });
  document.getElementById('videoOverlay').addEventListener('click', () => { document.getElementById('videoPlayer').innerHTML = ''; document.getElementById('videoOverlay').style.display = 'none'; document.getElementById('videoModal').style.display = 'none'; });
  document.getElementById('signInBtn').addEventListener('click', () => { authMode = 'login'; openAuthModal(); });
  document.getElementById('switchAuthBtn').addEventListener('click', () => { authMode = authMode === 'login' ? 'signup' : 'login'; openAuthModal(); });
  document.getElementById('authSubmitBtn').addEventListener('click', handleAuthSubmit);
  document.getElementById('closeAuthX').addEventListener('click', closeAuthModal);
  document.getElementById('cancelAuthBtn').addEventListener('click', closeAuthModal);
  document.getElementById('authOverlay').addEventListener('click', closeAuthModal);
  document.getElementById('searchInput').addEventListener('input', (e) => {
    if (activeTab === 'movies') {
      renderRows(allMovies, e.target.value, currentCategoryFilter);
    }
  });
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
  
  // Initialize
  buildCategoryFilters();
  switchTab('movies');
</script>
</body>
</html>
